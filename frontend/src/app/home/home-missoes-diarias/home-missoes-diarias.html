<div class="space-y-3">
  @for (missao of missoes(); track missao.id) {
    <article class="rounded-xl border border-border bg-surface p-4">
      <div class="flex items-start gap-3">
        <div
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full"
          [class.bg-success-light]="missao.concluida"
          [class.text-success]="missao.concluida"
          [class.bg-surface-2]="!missao.concluida"
          [class.text-foreground-secondary]="!missao.concluida">
          {{ missao.concluida ? '✓' : '!' }}
        </div>

        <div class="min-w-0 flex-1">
          <div class="flex items-start justify-between gap-3">
            <p class="font-medium text-foreground">{{ missao.titulo }}</p>
            <span class="shrink-0 text-sm font-semibold text-xp">+{{ missao.xp }} XP</span>
          </div>

          <div class="mt-3 h-2 overflow-hidden rounded-full bg-surface-2">
            <div
              class="h-full rounded-full bg-primary transition-all"
              [style.width.%]="percentual(missao)"></div>
          </div>

          <p class="mt-2 text-xs text-foreground-secondary">
            {{ missao.progressoAtual }} de {{ missao.meta }}
          </p>
        </div>
      </div>
    </article>
  } @empty {
    <div class="rounded-xl border border-dashed border-border p-5 text-center text-sm text-foreground-secondary">
      Nenhuma missão disponível hoje.
    </div>
  }
</div>
