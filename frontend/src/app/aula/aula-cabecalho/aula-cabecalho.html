<div class="bg-surface border border-border rounded-2xl p-6">
  
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <div class="flex items-center gap-2 text-xs text-foreground-secondary mb-2">
        <a routerLink="/aulas" class="hover:text-primary transition flex items-center gap-1">
          <mat-icon class="!w-4 !h-4 !text-[16px]">arrow_back</mat-icon>
          Aulas
        </a>
        <span>›</span>
        <span>{{ aula().materiaNome }}</span>
        <span>›</span>
        <span class="text-foreground font-medium truncate">{{ aula().moduloNome }}</span>
      </div>

      <h1 class="text-2xl font-bold text-foreground">
        {{ aula().titulo }}
      </h1>
      <p class="text-sm text-foreground-secondary mt-1 max-w-3xl">
        {{ aula().descricao }}
      </p>
    </div>

    <div class="flex items-center gap-3 self-start md:self-auto shrink-0">
      <span class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-surface-2 border border-border text-foreground-secondary flex items-center gap-1.5">
        <mat-icon class="!w-4 !h-4 !text-[16px]">schedule</mat-icon>
        {{ aula().duracaoMinutos }} min
      </span>
      <span class="text-xs font-bold px-3 py-1.5 rounded-xl bg-secondary-light text-secondary flex items-center gap-1.5">
        <mat-icon class="!w-4 !h-4 !text-[16px]">bolt</mat-icon>
        +{{ aula().xpTotal }} XP
      </span>
    </div>
  </div>

  <!-- abas de navegacao da aula -->
  <div class="flex items-center gap-2 mt-6 pt-4 border-t border-border">
    <button
      type="button"
      (click)="selecionarAba('TEORIA')"
      [class.bg-primary]="abaAtiva() === 'TEORIA'"
      [class.text-white]="abaAtiva() === 'TEORIA'"
      [class.shadow-sm]="abaAtiva() === 'TEORIA'"
      [class.bg-surface-2]="abaAtiva() !== 'TEORIA'"
      [class.text-foreground-secondary]="abaAtiva() !== 'TEORIA'"
      class="px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 cursor-pointer transition">
      <mat-icon class="!w-4 !h-4 !text-[18px]">menu_book</mat-icon>
      Teoria & Explicação
    </button>

    <button
      type="button"
      (click)="selecionarAba('QUESTOES')"
      [class.bg-primary]="abaAtiva() === 'QUESTOES'"
      [class.text-white]="abaAtiva() === 'QUESTOES'"
      [class.shadow-sm]="abaAtiva() === 'QUESTOES'"
      [class.bg-surface-2]="abaAtiva() !== 'QUESTOES'"
      [class.text-foreground-secondary]="abaAtiva() !== 'QUESTOES'"
      class="px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 cursor-pointer transition">
      <mat-icon class="!w-4 !h-4 !text-[18px]">quiz</mat-icon>
      Exercícios Práticos ({{ aula().questoes.length }})
    </button>
  </div>

</div>
