<main class="flex min-h-[calc(100vh-5rem)] items-center justify-center px-4 py-12">
  <section class="w-full max-w-lg rounded-2xl border border-border bg-surface p-8 text-center shadow-sm">
    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-primary-light text-primary">
      <mat-icon class="!h-8 !w-8 !text-[32px]">search_off</mat-icon>
    </div>

    <p class="mt-6 text-sm font-semibold uppercase tracking-wide text-primary">Erro 404</p>
    <h1 class="mt-2 text-2xl font-bold text-foreground">Página não encontrada</h1>
    <p class="mt-3 text-sm text-foreground-secondary">
      O endereço informado não existe ou a página foi movida.
    </p>

    <a
      routerLink="/home"
      class="mt-6 inline-flex items-center gap-2 rounded-xl bg-primary px-5 py-3 font-medium text-white transition hover:bg-primary-hover">
      <mat-icon>home</mat-icon>
      Voltar para a Home
    </a>
  </section>
</main>
