<main class="min-h-screen bg-background flex items-center justify-center px-4 py-8">
  <section class="w-full max-w-md">
    <div class="text-center mb-8">
      <p class="text-sm font-semibold uppercase tracking-wide text-primary">
        Conhecimento em movimento
      </p>

      <h1 class="mt-2 text-3xl font-bold text-foreground">
        Entre na sua conta
      </h1>

      <p class="mt-2 text-foreground-secondary">
        Continue sua jornada de estudos.
      </p>

      <p class="mt-3 text-xs text-foreground-muted">
        Demo: joao.silva@exemplo.com / 123456
      </p>
    </div>

    <form
      class="bg-surface border border-border rounded-2xl p-6 shadow-sm space-y-5"
      (ngSubmit)="entrar()"
    >
      <div>
        <label
          class="block text-sm font-medium text-foreground"
          for="email">
          E-mail
        </label>
        <input
          class="mt-2 w-full rounded-xl border border-border bg-background px-4 py-3 text-foreground outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          [(ngModel)]="email"
          required />
      </div>

      <div>
        <label
          class="block text-sm font-medium text-foreground"
          for="senha">
          Senha
        </label>
        <input
          class="mt-2 w-full rounded-xl border border-border bg-background px-4 py-3 text-foreground outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/20"
          id="senha"
          name="senha"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="senha"
          required />
      </div>

      @if (erro) {
        <p
          class="rounded-xl border border-danger/20 bg-danger-light px-4 py-3 text-sm text-danger"
          role="alert">
          {{ erro }}
        </p>
      }

      <button
        class="w-full rounded-xl bg-primary px-4 py-3 font-semibold text-white transition hover:bg-primary-hover disabled:cursor-not-allowed disabled:opacity-60"
        type="submit"
        [disabled]="carregando">
        {{ carregando ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </section>
</main>
