<header class="sticky top-0 z-30 flex h-20 shrink-0 items-center border-b border-border bg-surface px-4 sm:px-6">
    

    <div class="flex w-full min-w-0 items-center justify-between gap-4">
        <div>
            <a 
                type="button"
                class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-foreground-secondary transition hover:bg-primary-light hover:text-primary"
                routerLink="/">
                <mat-icon>school</mat-icon>
            </a>
        </div>
        
        <!-- msg/titulo da pag -->
        <div class="hidden min-w-0 flex-1 justify-center sm:flex">
            <span class="truncate text-sm text-foreground-secondary">
                Continue sua jornada de estudos
            </span>
        </div>

        <div class="flex shrink-0 items-center gap-2 sm:gap-3">
            <!-- notificacoes -->
                <button
                class="flex h-10 w-10 items-center justify-center rounded-xl bg-surface-2 text-foreground-secondary transition-colors duration-200 hover:bg-primary-light hover:text-primary sm:h-12 sm:w-12"
            routerLink="/notificacoes"
            aria-label="Notificações">
            <mat-icon>chat</mat-icon>
            </button>

            <!-- usuario -->
                <button class="
                    flex h-10 w-10 items-center justify-center rounded-xl bg-primary text-white transition-colors duration-200 hover:bg-primary-hover sm:h-12 sm:w-12"
                routerLink="/usuario"
                aria-label="Usuário">
                <mat-icon>person</mat-icon>
            </button>
        </div>
    </div>
</header>
