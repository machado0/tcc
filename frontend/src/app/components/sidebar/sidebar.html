<aside class="flex h-full w-16 shrink-0 flex-col border-r border-border bg-surface sm:w-20 lg:w-64">
    <nav class="flex flex-1 flex-col gap-1 p-3 lg:p-4">
        @for (item of itensMenu; track item.rota) {
            <a
                class="flex w-full items-center justify-center gap-3 rounded-lg px-3 py-2.5 text-foreground-secondary transition hover:bg-surface-2 lg:justify-start"
                [routerLink]="item.rota"
                routerLinkActive="bg-primary-light text-primary"
                [attr.aria-label]="item.texto">
                <mat-icon class="shrink-0">{{ item.icone }}</mat-icon>
                <span class="hidden lg:inline">{{ item.texto }}</span>
            </a>
        }

        <button
            type="button"
            class="mt-auto flex w-full items-center justify-center gap-3 rounded-lg px-3 py-2.5 text-foreground-secondary transition hover:bg-surface-2 lg:justify-start"
            aria-label="Sair"
            (click)="sair()">
            <mat-icon class="shrink-0">logout</mat-icon>
            <span class="hidden lg:inline">Sair</span>
        </button>
    </nav>
</aside>
